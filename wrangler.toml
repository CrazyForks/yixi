name = "yixi"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Nightly sessions trim (04:00 UTC = noon Shanghai). Only prunes the sessions
# breadcrumb table; events are kept forever, they are the whole product.
[triggers]
crons = ["0 4 * * *"]

[observability]
enabled = true

# Secrets (wrangler secret put ...):
#   COOKIE_SECRET — legacy; browser sessions are now server-side rows in
#                   sessions_web and the cookie carries only their id, so
#                   nothing signs anything any more. Harmless to keep.
#   TOKEN_KEY     — AES-GCM key the gate tokens are sealed under, so a
#                   logged-in holder can read their own key back. Never
#                   stored in D1: a stolen database alone opens nothing.
# User tokens live in the D1 `users` table as SHA-256 hashes; there is no
# global access token.

# NOTE for anyone cloning this: `database_id` below is the author's own
# database. It is not a credential — using it requires an API token for that
# account — but you MUST replace it with the id `wrangler d1 create yixi` prints
# for you.
#
# Getting this wrong fails in an unhelpful way: migrations are applied by
# database *name*, so they land on your database and appear to succeed, while
# the deployed Worker binds by *id* and ends up pointed at a database your token
# cannot read. Every request then 500s with nothing obviously misconfigured.
[[d1_databases]]
binding = "DB"
database_name = "yixi"
database_id = "64215db6-0a05-4ae9-a583-19c8790bef06"
